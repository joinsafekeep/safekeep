[build]
  command = "npm run check && node scripts/build-scam-alerts.mjs && node scripts/publish-site.mjs"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/account/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; connect-src 'self'; img-src 'self'; frame-src https://challenges.cloudflare.com; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"

[[headers]]
  for = "/invite/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; connect-src 'self'; img-src 'self'; frame-src https://challenges.cloudflare.com; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"

# The coaching page: /p/<token> serves one static page that reads the token from the path.
[[redirects]]
  from = "/p/*"
  to = "/practice/index.html"
  status = 200

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"

[[headers]]
  for = "/practice/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"

# Confirm and unsubscribe links carry an address and a signature: keep them out of referrers and search.
[[headers]]
  for = "/scam-alerts/subscribe/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

# Family web version of a monthly report: /r/<token> serves one static page that reads the token from the path.
[[redirects]]
  from = "/r/*"
  to = "/report/index.html"
  status = 200

[[headers]]
  for = "/r/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
